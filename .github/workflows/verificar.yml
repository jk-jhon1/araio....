name: verificar
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build reproduz o index.html commitado
        run: |
          node build.js
          git diff --exit-code index.html
      - name: Suíte Node (catálogo, alcance, seeds, layouts, transferência, conquistas, equipamentos, chicote)
        run: npm test
