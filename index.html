<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>RESTUDING - Beta v0.7</title>
  <style>
    /* ============ RESET & BASE ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; background: #0d0d1a; overflow: hidden;
      font-family: 'Courier New', monospace; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    body { display: flex; flex-direction: column; }

    /* ============ GAME AREA ============ */
    #gameArea {
      flex: 1; min-height: 0; display: flex;
      align-items: center; justify-content: center; position: relative;
    }
    #gameCanvas {
      max-width: 100%; max-height: 100%;
      image-rendering: auto; background: #000; box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    /* ============ MOBILE CONTROLS ============ */
    #mCtrl {
      height: 140px; flex-shrink: 0; z-index: 500; display: none;
      justify-content: space-between; align-items: center;
      padding: 10px 18px; background: #12122a; border-top: 2px solid #2a2a4a;
    }
    .dpad { display: flex; gap: 14px; }
    .dbtn, .abtn {
      border: 3px solid rgba(255, 255, 255, 0.4);
      font-family: 'Courier New', monospace; font-weight: bold; color: #fff;
      cursor: pointer; transition: transform 0.08s, filter 0.08s;
    }
    .dbtn { width: 74px; height: 74px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); font-size: 26px; }
    .acts { display: flex; flex-direction: column; gap: 10px; }
    .abtn { width: 110px; height: 56px; border-radius: 14px; font-size: 15px; }
    #btnJump { background: rgba(60, 130, 255, 0.75); }
    #btnInteract { background: rgba(240, 200, 40, 0.85); color: #222; }
    .dbtn:active, .abtn:active { filter: brightness(1.5); transform: scale(0.92); }

    @media (max-width: 768px) {
      .dbtn { width: 64px; height: 64px; font-size: 22px; }
      .abtn { width: 95px; height: 48px; font-size: 13px; }
      #mCtrl { height: 120px; }
    }
    @media (max-width: 480px) {
      .dbtn { width: 56px; height: 56px; font-size: 20px; }
      .abtn { width: 85px; height: 44px; font-size: 12px; }
      #mCtrl { height: 110px; padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <div id="gameArea"><canvas id="gameCanvas"></canvas></div>
  <div id="mCtrl">
    <div class="dpad">
      <button class="dbtn" id="btnLeft">◀</button>
      <button class="dbtn" id="btnRight">▶</button>
    </div>
    <div class="acts">
      <button class="abtn" id="btnInteract">INTERAGIR</button>
      <button class="abtn" id="btnJump">PULAR</button>
    </div>
  </div>

<script>
// ============ SAVE SYSTEM (Sem Áudio) ============
const SaveSystem = (() => {
  const KEY = 'restuding_save_v2';
  function loadData() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return {
          endings: Array.isArray(parsed.endings) ? parsed.endings : [],
          bestTime: typeof parsed.bestTime === 'number' ? parsed.bestTime : null
        };
      }
    } catch (e) {}
    return { endings: [], bestTime: null };
  }
  let data = loadData();
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  function unlockEnding(id) {
    if (!data.endings.includes(id)) { data.endings.push(id); persist(); return true; }
    return false;
  }
  function setBestTime(seconds) {
    if (data.bestTime === null || seconds < data.bestTime) { data.bestTime = seconds; persist(); return true; }
    return false;
  }
  return { unlockEnding, getEndings: () => data.endings.slice(), setBestTime, getBestTime: () => data.bestTime };
})();

// ============ GAME GLOBALS ============
const C = document.getElementById('gameCanvas');
const X = C.getContext('2d');
let GW = 960, GH = 540;
const TOTAL_ENDINGS = 2;

let GRAV, JUMPF, SPD, GROUND_Y, WALL_L, WALL_R;
const COYOTE_FRAMES = 6, JUMPBUFFER_FRAMES = 8;
let coyoteTimer = 0, jumpBufferTimer = 0;

let state = 'title'; // title | classroom | teaching | ending | ending2
let fr = 0, iCD = 0;
const stars = Array.from({length: 60}, () => ({x: Math.random(), y: Math.random(), s: Math.random()*2+1, p: Math.random()*6}));

const P = { x: 0, y: 0, w: 52, h: 88, vx: 0, vy: 0, facing: 1, onGround: true, hasItem: false, wt: 0, wf: 0, animT: 0, squash: 0, lastVy: 0 };
const item = { x: 0, y: 0, w: 46, h: 46, taken: false };
const stu = { x: 0, y: 0, w: 46, h: 72 };
const tvArea = { x: 0, y: 0, w: 0, h: 0 };

const speechLines = ["Professor! Chegou!", "O mundo precisa de você!", "Pegue o item ENSINAR", "ali perto do quadro!", "Depois volte e use em mim!", "Controles:", "← → para andar", "ESPAÇO para pular", "E para interagir!", "No celular: use os botões!", "Estou te esperando!"];
let speechIdx = 0, speechChar = 0, speechTimer = 0, speechDone = false;
let teachTimer = 0, endChar = 0, particles = [], lastStepFrame = 0, wasOnGround = true;

let ignoreTimer = 0;
const IGNORE_THRESHOLD = 2700; // ~45s para o final secreto
let classroomStartFrame = 0, finalElapsed = null, lastEndingIsNew = false, lastEndingIsRecord = false;

let fadeAlpha = 0, fadeDir = 0, pendingAction = null;
let shakeAmt = 0;

// ============ UTILS ============
const isMob = (() => (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || ("ontouchstart" in window && navigator.maxTouchPoints > 0) || innerWidth < 900))();
if (isMob) document.getElementById('mCtrl').style.display = 'flex';

function resize() {
  const aw = document.getElementById('gameArea').clientWidth, ah = document.getElementById('gameArea').clientHeight;
  const ratio = 16 / 9;
  let w = aw, h = aw / ratio;
  if (h > ah) { h = ah; w = ah * ratio; }
  GW = Math.floor(w); GH = Math.floor(h);
  C.width = GW; C.height = GH;
  GRAV = GH * 0.0008; JUMPF = -GH * 0.017; SPD = GW * 0.003; GROUND_Y = GH * 0.86;
  WALL_L = GW * 0.02; WALL_R = GW * 0.98;
  P.w = GW * 0.055; P.h = GH * 0.17; item.w = GW * 0.05; item.h = GH * 0.08; stu.w = GW * 0.05; stu.h = GH * 0.14;
  tvArea.x = GW * 0.00; tvArea.y = GH * 0.62; tvArea.w = GW * 0.32; tvArea.h = GH * 0.19;
  if (state === 'title' || !P.x) { resetGame(); }
}
addEventListener('resize', resize);

function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
const near = (a, b, d) => Math.abs((a.x + a.w / 2) - (b.x + b.w / 2)) < d;
function fmtTime(s) {
  if (s === null) return '--:--';
  const m = Math.floor(s / 60); const sec = (s % 60).toFixed(2).padStart(5, '0'); return `${m}:${sec}`;
}
function getElapsedSeconds() { return finalElapsed !== null ? finalElapsed : (fr - classroomStartFrame) / 60; }

function resetGame() {
  P.x = GW * 0.5; P.y = GROUND_Y - P.h; P.vx = 0; P.vy = 0; P.hasItem = false; P.facing = 1; P.onGround = true; P.animT = 0; P.squash = 0;
  item.x = GW * 0.72; item.y = GROUND_Y - item.h; item.taken = false;
  stu.x = GW * 0.13; stu.y = GROUND_Y - stu.h;
  speechIdx = 0; speechChar = 0; speechTimer = 0; speechDone = false;
  teachTimer = 0; endChar = 0; particles = []; ignoreTimer = 0; finalElapsed = null; classroomStartFrame = fr; wasOnGround = true;
}

// ============ VISUAL FX ============
function triggerShake(amt) { shakeAmt = Math.max(shakeAmt, amt); }
function applyShake() {
  if (shakeAmt > 0) { shakeAmt *= 0.85; if (shakeAmt < 0.3) shakeAmt = 0; return { x: (Math.random() - 0.5) * shakeAmt, y: (Math.random() - 0.5) * shakeAmt }; }
  return { x: 0, y: 0 };
}
function triggerDust(x, y, count) {
  for (let i = 0; i < count; i++) {
    particles.push({ x: x + (Math.random() - 0.5) * 22, y: y - Math.random() * 6, vx: (Math.random() - 0.5) * 1.4, vy: -Math.random() * 1.1, life: 18 + Math.random() * 12, cor: '200,190,170', type: 'dust', size: 2 + Math.random() * 2 });
  }
}
function transitionTo(cb) { if (fadeDir === 0) { fadeDir = 1; pendingAction = cb; } }
function updateFade() {
  if (fadeDir === 1) { fadeAlpha += 0.06; if (fadeAlpha >= 1) { fadeAlpha = 1; if (pendingAction) { pendingAction(); pendingAction = null; } fadeDir = -1; } }
  else if (fadeDir === -1) { fadeAlpha -= 0.06; if (fadeAlpha <= 0) { fadeAlpha = 0; fadeDir = 0; } }
}

// ============ INPUT ============
const K = {}, JP = {}, mob = { left: false, right: false, jump: false }, mobJP = {};
addEventListener('keydown', e => { if (!K[e.code]) JP[e.code] = true; K[e.code] = true; if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e => K[e.code] = false);
function bindBtn(id, on, off) {
  const el = document.getElementById(id);
  const s = e => { e.preventDefault(); on(); }; const en = e => { e.preventDefault(); off(); };
  el.addEventListener('touchstart', s, { passive: false }); el.addEventListener('touchend', en, { passive: false }); el.addEventListener('mousedown', s); el.addEventListener('mouseup', en);
}
bindBtn('btnLeft', () => { mob.left = true; vibrate(10); }, () => mob.left = false);
bindBtn('btnRight', () => { mob.right = true; vibrate(10); }, () => mob.right = false);
bindBtn('btnJump', () => { mob.jump = true; mobJP.jump = true; vibrate(15); }, () => mob.jump = false);
bindBtn('btnInteract', () => { mobJP.interact = true; vibrate(15); }, () => {});
C.addEventListener('touchstart', () => { if (state === 'title' || state === 'ending' || state === 'ending2') mobJP.interact = true; }, { passive: true });
C.addEventListener('click', () => { if (state === 'title' || state === 'ending' || state === 'ending2') mobJP.interact = true; });
function iL() { return K.ArrowLeft || K.KeyA || mob.left; } function iR() { return K.ArrowRight || K.KeyD || mob.right; } function iJ() { return K.Space || K.ArrowUp || K.KeyW || mob.jump; }
function iI() { if (iCD > 0) return false; if (JP.KeyE || JP.Enter || mobJP.interact) { iCD = 15; mobJP.interact = false; return true; } return false; }

// ============ UPDATES ============
function updatePlayer() {
  P.vx = 0;
  if (iL()) { P.vx = -SPD; P.facing = -1; } if (iR()) { P.vx = SPD; P.facing = 1; }
  if (P.onGround) coyoteTimer = COYOTE_FRAMES; else if (coyoteTimer > 0) coyoteTimer--;
  if (JP.Space || JP.ArrowUp || mobJP.jump) jumpBufferTimer = JUMPBUFFER_FRAMES; else if (jumpBufferTimer > 0) jumpBufferTimer--;
  if (jumpBufferTimer > 0 && coyoteTimer > 0) { P.vy = JUMPF; P.onGround = false; coyoteTimer = 0; jumpBufferTimer = 0; triggerDust(P.x + P.w / 2, GROUND_Y, 6); }
  if (!iJ() && P.vy < JUMPF * 0.4) P.vy = JUMPF * 0.4;
  P.vy += GRAV; if (P.vy > GH * 0.02) P.vy = GH * 0.02;
  P.x += P.vx; if (P.x < WALL_L) P.x = WALL_L; if (P.x + P.w > WALL_R) P.x = WALL_R - P.w;
  P.y += P.vy; if (P.y + P.h >= GROUND_Y) { P.lastVy = P.vy; P.y = GROUND_Y - P.h; P.vy = 0; P.onGround = true; }
  if (P.y < 10) { P.y = 10; P.vy = 0; }
  if (!wasOnGround && P.onGround) { const fs = Math.abs(P.lastVy || 0); if (fs > GH * 0.008) { triggerShake(Math.min(6, fs * 90)); triggerDust(P.x + P.w / 2, GROUND_Y, 10); P.squash = Math.min(1, fs * 0.08); } }
  wasOnGround = P.onGround;
  if (P.squash > 0) { P.squash -= 0.09; if (P.squash < 0) P.squash = 0; }
  if (Math.abs(P.vx) > 0.1) { P.wt++; if (P.wt > 6) { P.wf++; P.wt = 0; } if (fr - lastStepFrame > 14 && P.onGround) { triggerDust(P.x + P.w / 2, GROUND_Y - 2, 2); lastStepFrame = fr; } } else { P.wf = 0; P.wt = 0; }
}

function updateGameLogic() {
  if (!speechDone) {
    speechTimer++; const cur = speechLines[speechIdx];
    if (speechChar < cur.length) { if (speechTimer % 3 === 0) speechChar++; }
    else if (speechTimer > cur.length * 3 + 100) { speechIdx++; speechChar = 0; speechTimer = 0; if (speechIdx >= speechLines.length) speechDone = true; }
  }
  if (!item.taken && near(P, item, GW * 0.09) && iI()) { item.taken = true; P.hasItem = true; triggerShake(4); for (let i = 0; i < 28; i++) particles.push({ x: P.x + P.w / 2, y: P.y + P.h / 2, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 45, cor: '255,215,80' }); }
  if (P.hasItem && near(P, stu, GW * 0.11) && iI()) { triggerShake(5); state = 'teaching'; teachTimer = 0; }
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) particles.splice(i, 1); }
  if (speechDone && !item.taken) { ignoreTimer++; if (ignoreTimer >= IGNORE_THRESHOLD) transitionTo(() => { finalizeEnding('final2'); state = 'ending2'; endChar = 0; particles = []; }); } else { ignoreTimer = 0; }
}

function finalizeEnding(id) { finalElapsed = (fr - classroomStartFrame) / 60; lastEndingIsNew = SaveSystem.unlockEnding(id); lastEndingIsRecord = SaveSystem.setBestTime(finalElapsed); }

// ============ DRAWING ============
function drawRoom() {
  let g = X.createLinearGradient(0, 0, 0, GROUND_Y); g.addColorStop(0, '#e8d8b8'); g.addColorStop(1, '#d4bf98'); X.fillStyle = g; X.fillRect(0, 0, GW, GROUND_Y);
  X.fillStyle = '#8a5a30'; X.fillRect(0, GROUND_Y, GW, GH - GROUND_Y); X.fillStyle = '#7a4e28'; for (let i = 0; i < 12; i++) X.fillRect(0, GROUND_Y + 8 + i * 7, GW, 2); X.fillStyle = '#5a3a1e'; X.fillRect(0, GROUND_Y - 8, GW, 8);
  X.fillStyle = '#6b4a2a'; X.fillRect(GW * 0.60, GH * 0.14, GW * 0.30, GH * 0.30); X.fillStyle = '#2a4a3a'; X.fillRect(GW * 0.615, GH * 0.155, GW * 0.27, GH * 0.26); X.strokeStyle = 'rgba(255,255,255,.35)'; X.lineWidth = 3; X.strokeRect(GW * 0.615, GH * 0.155, GW * 0.27, GH * 0.26);
  X.fillStyle = 'rgba(255,255,255,.75)'; X.font = `bold ${Math.floor(GH * 0.05)}px Courier New`; X.textAlign = 'center'; X.fillText('RESTUDING', GW * 0.75, GH * 0.24); X.font = `${Math.floor(GH * 0.03)}px Courier New`; X.fillText('conhecimento = poder', GW * 0.75, GH * 0.30);
  X.fillStyle = '#222'; X.fillRect(tvArea.x - 6, tvArea.y - 6, tvArea.w + 12, tvArea.h + 12); X.fillStyle = '#334'; X.fillRect(tvArea.x, tvArea.y, tvArea.w, tvArea.h);
  X.fillStyle = '#6b4a2a'; X.fillRect(GW * 0.36, GH * 0.12, GW * 0.16, GH * 0.24); X.save(); X.beginPath(); X.rect(GW * 0.37, GH * 0.13, GW * 0.14, GH * 0.22); X.clip(); X.fillStyle = '#9ecfff'; X.fillRect(GW * 0.37, GH * 0.13, GW * 0.14, GH * 0.22); X.fillStyle = 'rgba(255,255,255,.6)'; const co = (fr * 0.15) % (GW * 0.3); X.beginPath(); X.ellipse(GW * 0.37 + co - GW * 0.1, GH * 0.18, GW * 0.03, GH * 0.015, 0, 0, 7); X.fill(); X.beginPath(); X.ellipse(GW * 0.37 + co + GW * 0.05, GH * 0.28, GW * 0.025, GH * 0.012, 0, 0, 7); X.fill(); X.restore(); X.strokeStyle = '#6b4a2a'; X.lineWidth = 4; X.beginPath(); X.moveTo(GW * 0.44, GH * 0.13); X.lineTo(GW * 0.44, GH * 0.35); X.moveTo(GW * 0.37, GH * 0.24); X.lineTo(GW * 0.51, GH * 0.24); X.stroke();
  X.fillStyle = '#7a5230'; X.fillRect(stu.x - GW * 0.02, GROUND_Y - GH * 0.06, stu.w + GW * 0.05, GH * 0.02); X.fillRect(stu.x - GW * 0.015, GROUND_Y - GH * 0.04, GW * 0.015, GH * 0.06); X.fillRect(stu.x + stu.w + GW * 0.02, GROUND_Y - GH * 0.04, GW * 0.015, GH * 0.06);
}

function drawTeacher() {
  const sw = P.w, sh = P.h, mov = Math.abs(P.vx) > 0.1, air = !P.onGround;
  const ib = (!mov && !air) ? Math.sin(fr * 0.05) * (sh * 0.01) : 0;
  X.save(); X.translate(P.x + (P.facing < 0 ? sw : 0), P.y + ib + sh); if (P.facing < 0) X.scale(-1, 1);
  X.scale(1 + P.squash * 0.2, 1 - P.squash * 0.28); X.translate(0, -sh);
  const u = sw / 13;
  X.fillStyle = '#2a2a3a';
  if (air) { X.fillRect(2.5 * u, 14 * u, 3.5 * u, 6 * u); X.fillRect(7 * u, 14 * u, 3.5 * u, 6 * u); }
  else if (mov) { P.animT++; X.fillRect(2 * u, 13 * u - Math.max(0, Math.sin(P.animT * 0.35)) * u * 1.6, 4 * u, 8 * u); X.fillRect(7 * u, 13 * u - Math.max(0, Math.sin(P.animT * 0.35 + Math.PI)) * u * 1.6, 4 * u, 8 * u); }
  else { P.animT = 0; X.fillRect(2 * u, 13 * u, 4 * u, 8 * u); X.fillRect(7 * u, 13 * u, 4 * u, 8 * u); }
  X.fillStyle = '#1a1a1a'; X.fillRect(1.5 * u, 20 * u, 5 * u, 2 * u); X.fillRect(6.5 * u, 20 * u, 5 * u, 2 * u);
  X.fillStyle = '#f0f0e8'; X.fillRect(1 * u, 7 * u, 11 * u, 7 * u); X.fillStyle = '#3a5a8a'; X.fillRect(5.5 * u, 7 * u, 2 * u, 7 * u);
  X.fillStyle = '#f0c8a0'; X.fillRect(2.5 * u, 1 * u, 8 * u, 6 * u); X.fillStyle = '#4a3a2a'; X.fillRect(2 * u, 0, 9 * u, 2.2 * u);
  X.fillStyle = '#222'; X.fillRect(3 * u, 3 * u, 3 * u, 2 * u); X.fillRect(7.5 * u, 3 * u, 3 * u, 2 * u); X.fillRect(6 * u, 3.6 * u, 1.5 * u, 0.8 * u);
  X.fillStyle = 'rgba(180,220,255,.7)'; X.fillRect(3.3 * u, 3.3 * u, 2.4 * u, 1.4 * u); X.fillRect(7.8 * u, 3.3 * u, 2.4 * u, 1.4 * u);
  if (P.hasItem) {
    X.fillStyle = '#f0c8a0'; X.fillRect(11 * u, 8 * u, 2.5 * u, 4 * u); X.fillStyle = `rgba(255,215,80,${0.6 + Math.sin(fr * 0.15) * 0.4})`; X.fillRect(10.5 * u, 5 * u, 3.5 * u, 3.5 * u); X.fillStyle = '#c8960a'; X.fillRect(11 * u, 5.5 * u, 2.5 * u, 2.5 * u); X.fillStyle = '#fff'; X.fillRect(11.4 * u, 5.9 * u, 1.7 * u, 1.7 * u);
  } else { X.fillStyle = '#f0c8a0'; const as = mov ? Math.sin(P.animT * 0.35) * u * 0.4 : 0; X.fillRect(0.2 * u, 8 * u + as, 2 * u, 5 * u); X.fillRect(10.8 * u, 8 * u - as, 2 * u, 5 * u); }
  X.restore();
  X.fillStyle = 'rgba(0,0,0,.25)'; const ss = air ? Math.max(0.5, 1 - Math.abs(P.vy) * 0.03) : 1; X.beginPath(); X.ellipse(P.x + P.w / 2, GROUND_Y + 4, P.w * 0.55 * ss, 6 * ss, 0, 0, 7); X.fill();
}

function drawStudent() {
  const sx = stu.x, sy = stu.y + Math.sin(fr * 0.05) * 2, u = stu.w / 11;
  X.fillStyle = '#4a6a9a'; X.fillRect(sx + 2 * u, sy + 7 * u, 7 * u, 8 * u); X.fillStyle = '#e8b890'; X.fillRect(sx + 2 * u, sy + 1 * u, 7 * u, 6 * u); X.fillStyle = '#2a1a1a'; X.fillRect(sx + 1.5 * u, sy, 8 * u, 2.5 * u);
  X.fillStyle = (fr % 140 < 8) ? '#e8b890' : '#222'; X.fillRect(sx + 3.2 * u, sy + 3.5 * u, 1.2 * u, 1.5 * u); X.fillRect(sx + 6.4 * u, sy + 3.5 * u, 1.2 * u, 1.5 * u); X.fillStyle = '#a06050'; X.fillRect(sx + 4 * u, sy + 5.5 * u, 3 * u, 0.8 * u);
  X.fillStyle = '#e8b890'; X.fillRect(sx + 8.5 * u, sy + 4 * u + Math.sin(fr * 0.1) * u, 2 * u, 5 * u);
  X.fillStyle = 'rgba(0,0,0,.25)'; X.beginPath(); X.ellipse(stu.x + stu.w / 2, GROUND_Y + 4, stu.w * 0.55, 5, 0, 0, 7); X.fill();
}

function drawItem() {
  if (item.taken) return;
  const ix = item.x, iy = item.y - 12 + Math.sin(fr * 0.06) * 4;
  X.fillStyle = `rgba(255,255,255,${0.10 + Math.sin(fr * 0.08) * 0.06})`; X.fillRect(ix - 8, iy - 8, item.w + 16, item.h + 16);
  X.fillStyle = '#c8960a'; X.fillRect(ix, iy, item.w, item.h * 0.75); X.fillStyle = '#f0c040'; X.fillRect(ix + 3, iy + 3, item.w - 6, item.h * 0.75 - 6); X.fillStyle = '#fff8e0'; X.fillRect(ix + 7, iy + 7, item.w - 14, item.h * 0.75 - 14); X.strokeStyle = '#c8960a'; X.lineWidth = 2; X.beginPath(); X.moveTo(ix + item.w / 2, iy + 7); X.lineTo(ix + item.w / 2, iy + item.h * 0.75 - 7); X.stroke();
  X.fillStyle = `rgba(255,220,100,${0.7 + Math.sin(fr * 0.12) * 0.3})`; X.font = `${Math.floor(item.w * 0.6)}px Courier New`; X.textAlign = 'center'; X.fillText('★', ix + item.w / 2, iy - 2);
  X.fillStyle = 'rgba(0,0,0,.2)'; X.beginPath(); X.ellipse(ix + item.w / 2, GROUND_Y + 4, item.w * 0.5, 5, 0, 0, 7); X.fill();
  X.fillStyle = '#7a5a10'; X.font = `bold ${Math.floor(GH * 0.028)}px Courier New`; X.fillText('ENSINAR', ix + item.w / 2, iy - 14);
}

function drawTV() {
  const fs = Math.max(16, Math.floor(tvArea.w / 14));
  X.fillStyle = 'rgba(20, 25, 50, 0.55)'; X.fillRect(tvArea.x, tvArea.y, tvArea.w, tvArea.h);
  X.strokeStyle = (ignoreTimer > IGNORE_THRESHOLD * 0.7) ? `rgba(255,60,60,${(Math.sin(fr * 0.3) * 0.5 + 0.5) * 0.5})` : 'rgba(255,255,255,0.2)'; X.lineWidth = (ignoreTimer > IGNORE_THRESHOLD * 0.7) ? 3 : 2; X.strokeRect(tvArea.x + 1, tvArea.y + 1, tvArea.w - 2, tvArea.h - 2);
  X.font = `${Math.floor(fs * 0.6)}px Courier New`; X.fillStyle = 'rgba(255,255,255,.6)'; X.textAlign = 'right'; X.fillText(`${Math.min(speechIdx + 1, speechLines.length)}/${speechLines.length}`, tvArea.x + tvArea.w - 8, tvArea.y + fs * 0.8);
  const txt = speechLines[Math.min(speechIdx, speechLines.length - 1)].substring(0, speechChar); X.font = `bold ${fs}px Courier New`; X.textAlign = 'center'; X.fillStyle = 'rgba(0,0,0,.5)'; X.fillText(txt, tvArea.x + tvArea.w / 2 + 2, tvArea.y + tvArea.h / 2 + fs * 0.35 + 2); X.fillStyle = '#fff'; X.fillText(txt, tvArea.x + tvArea.w / 2, tvArea.y + tvArea.h / 2 + fs * 0.35);
  X.font = `${Math.floor(fs * 0.65)}px Courier New`; X.textAlign = 'left'; X.fillStyle = '#ffd050'; X.fillText(`Felquinha ${speechDone ? '' : '.'.repeat(1 + Math.floor(fr / 20) % 3)}`, tvArea.x + 8, tvArea.y + tvArea.h - 8);
}

function drawHUD() {
  X.textAlign = 'center';
  if (state === 'classroom') {
    if (!item.taken && near(P, item, GW * 0.09)) { X.font = `bold ${Math.floor(GH * 0.035)}px Courier New`; X.fillStyle = 'rgba(0,0,0,.6)'; X.fillRect(GW / 2 - 140, GH * 0.05 - 24, 280, 40); X.fillStyle = '#ffd050'; X.fillText('[ E ] PEGAR', GW / 2, GH * 0.05 + 4); }
    if (P.hasItem && near(P, stu, GW * 0.11)) { X.font = `bold ${Math.floor(GH * 0.035)}px Courier New`; X.fillStyle = 'rgba(0,0,0,.6)'; X.fillRect(GW / 2 - 150, GH * 0.05 - 24, 300, 40); X.fillStyle = '#ffd050'; X.fillText('[ E ] ENSINAR', GW / 2, GH * 0.05 + 4); }
  }
  if (P.hasItem) { X.textAlign = 'left'; X.font = `bold ${Math.floor(GH * 0.028)}px Courier New`; X.fillStyle = '#ffd050'; X.fillText('★ ENSINAR', 14, 30); }
  if (state === 'classroom' || state === 'teaching') { X.textAlign = 'left'; X.font = `${Math.floor(GH * 0.022)}px Courier New`; X.fillStyle = 'rgba(255,255,255,.55)'; X.fillText(`⏱ ${fmtTime(getElapsedSeconds())}`, 14, GH - 14); X.textAlign = 'right'; X.fillText(`🏆 ${SaveSystem.getEndings().length}/${TOTAL_ENDINGS}`, GW - 14, GH - 14); }
}

function drawTitle() {
  X.fillStyle = '#0d0d2a'; X.fillRect(0, 0, GW, GH);
  for (const s of stars) { X.fillStyle = `rgba(255,255,255,${0.4 + Math.sin(fr * 0.05 + s.p) * 0.6})`; X.fillRect(s.x * GW, s.y * GH, s.s, s.s); }
  X.textAlign = 'center'; X.font = `bold ${Math.floor(GH * 0.14)}px Courier New`; X.fillStyle = 'rgba(0,0,0,.6)'; X.fillText('RESTUDING', GW / 2 + 5, GH * 0.38 + 5); X.fillStyle = '#ffd000'; X.fillText('RESTUDING', GW / 2, GH * 0.38);
  X.font = `${Math.floor(GH * 0.032)}px Courier New`; X.fillStyle = '#aab'; X.fillText('Jogo Indie de Plataforma 2D — Beta v0.7', GW / 2, GH * 0.46); X.fillStyle = '#e88'; X.fillText('Múltiplos Finais (Sem Áudio)', GW / 2, GH * 0.51);
  X.font = `${Math.floor(GH * 0.024)}px Courier New`; X.fillStyle = '#8f9'; X.fillText(`Finais descobertos: ${SaveSystem.getEndings().length}/${TOTAL_ENDINGS}`, GW / 2, GH * 0.58);
  const best = SaveSystem.getBestTime(); if (best !== null) { X.fillStyle = '#9cf'; X.fillText(`Melhor tempo: ${fmtTime(best)}`, GW / 2, GH * 0.63); }
  if (fr % 60 < 35) { X.font = `bold ${Math.floor(GH * 0.038)}px Courier New`; X.fillStyle = '#fff'; X.fillText(isMob ? 'Toque para começar' : 'Pressione E para começar', GW / 2, GH * 0.75); }
}

function drawEndingScreens(isSad) {
  let g = X.createLinearGradient(0, 0, 0, GH);
  g.addColorStop(0, isSad ? '#141420' : '#1a1030'); g.addColorStop(1, isSad ? '#2a2030' : '#3a2a10'); X.fillStyle = g; X.fillRect(0, 0, GW, GH);
  if (fr % (isSad ? 8 : 5) === 0) particles.push(isSad ? { x: Math.random() * GW, y: -10, vx: (Math.random() - 0.5) * 0.5, vy: Math.random() * 0.8 + 0.3, life: 200, cor: '150,150,170', type: 'dust', size: 1.5 } : { x: Math.random() * GW, y: GH + 10, vx: (Math.random() - 0.5), vy: -Math.random() * 2 - 1, life: 120, cor: '255,215,100' });
  X.textAlign = 'center'; X.font = `bold ${Math.floor(GH * 0.09)}px Courier New`; X.fillStyle = isSad ? '#8899aa' : '#ffd000'; X.fillText(isSad ? 'FINAL SECRETO' : 'FINAL 1', GW / 2, GH * 0.18); X.font = `bold ${Math.floor(GH * 0.05)}px Courier New`; X.fillStyle = isSad ? '#ccd' : '#fff'; X.fillText(isSad ? 'O Silêncio da Sala' : 'O Primeiro Ensinamento', GW / 2, GH * 0.27);
  const full = isSad ? "Felquinha esperou. E esperou.||Você nunca pegou o item.|Nunca aprendeu, nunca ensinou.||Ela apagou a apresentação|e saiu da sala em silêncio.||Algumas oportunidades não voltam." : "Você pegou o item ENSINAR e transmitiu|conhecimento para Felquinha.||A sala se encheu de luz dourada.|O primeiro passo para salvar o mundo|foi dado: ENSINAR.||O conhecimento é a maior arma contra o caos.";
  endChar = Math.min(endChar + 0.5, full.length); const shown = full.substring(0, Math.floor(endChar)).split('|'); X.font = `${Math.floor(GH * 0.03)}px Courier New`; X.fillStyle = isSad ? '#a0a0b0' : '#e8d8b0'; shown.forEach((ln, i) => X.fillText(ln, GW / 2, GH * 0.38 + i * GH * 0.05));
  if (endChar >= 40) {
    X.font = `${Math.floor(GH * 0.026)}px Courier New`; X.fillStyle = '#fff'; X.fillText(`Tempo: ${fmtTime(finalElapsed)}`, GW / 2, GH * 0.82);
    if (lastEndingIsRecord) { X.fillStyle = '#ffd000'; X.fillText('🏆 NOVO RECORDE!', GW / 2, GH * 0.86); }
    if (lastEndingIsNew) { X.fillStyle = '#8f9'; X.fillText('✨ NOVO FINAL DESBLOQUEADO!', GW / 2, GH * 0.90); }
    if (fr % 60 < 35) { X.font = `bold ${Math.floor(GH * 0.03)}px Courier New`; X.fillStyle = '#fff'; X.fillText(isMob ? 'Toque para jogar de novo' : 'Pressione E para jogar novamente', GW / 2, GH * 0.95); }
  }
  X.fillStyle = '#ffd000'; X.font = `${Math.floor(GH * 0.024)}px Courier New`; X.fillText(`Finais: ${SaveSystem.getEndings().length}/${TOTAL_ENDINGS} descobertos`, GW / 2, GH * 0.99);
}

// ============ LOOP ============
function loop() {
  fr++; if (iCD > 0) iCD--;
  if (state === 'title') {
    drawTitle(); if (iI() || JP.Space) transitionTo(() => { resetGame(); state = 'classroom'; });
  } else if (state === 'classroom') {
    updatePlayer(); updateGameLogic();
    const shake = applyShake(); X.save(); X.translate(shake.x, shake.y);
    drawRoom(); drawItem(); drawStudent(); drawTeacher();
    for (const p of particles) { const a = Math.min(1, p.life / 30); if (p.type === 'dust') { X.fillStyle = `rgba(${p.cor},${a * 0.6})`; X.beginPath(); X.arc(p.x, p.y, p.size || 2, 0, 7); X.fill(); } else { X.fillStyle = `rgba(${p.cor},${a})`; X.fillRect(p.x - 2, p.y - 2, 5, 5); } }
    X.restore(); drawTV(); drawHUD();
  } else if (state === 'teaching') {
    teachTimer++; const shake = applyShake(); X.save(); X.translate(shake.x, shake.y);
    drawRoom(); drawItem(); drawStudent(); drawTeacher();
    const x1 = P.x + P.w / 2, y1 = P.y + P.h * 0.4, x2 = stu.x + stu.w / 2, y2 = stu.y + stu.h * 0.4, t = teachTimer / 100;
    X.strokeStyle = 'rgba(255,215,80,.85)'; X.lineWidth = 12; X.lineCap = 'round'; X.beginPath(); X.moveTo(x1, y1); X.lineTo(x1 + (x2 - x1) * Math.min(1, t * 2), y1 + (y2 - y1) * Math.min(1, t * 2)); X.stroke(); X.strokeStyle = 'rgba(255,255,220,.9)'; X.lineWidth = 5; X.stroke();
    if (teachTimer % 3 === 0) particles.push({ x: x1 + (x2 - x1) * Math.random(), y: y1 + (y2 - y1) * Math.random(), vx: (Math.random() - 0.5) * 2, vy: -Math.random() * 2 - 0.5, life: 45, cor: '255,230,120' });
    if (t > 0.5) { X.fillStyle = `rgba(255,240,180,${(t - 0.5) * 0.7})`; X.fillRect(stu.x - 10, stu.y - 10, stu.w + 20, stu.h + 20); }
    for (const p of particles) { const a = Math.min(1, p.life / 30); X.fillStyle = `rgba(${p.cor},${a})`; X.fillRect(p.x - 2, p.y - 2, 5, 5); }
    X.restore();
    if (teachTimer >= 100) transitionTo(() => { finalizeEnding('final1'); state = 'ending'; endChar = 0; particles = []; });
  } else if (state === 'ending' || state === 'ending2') {
    for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) particles.splice(i, 1); }
    drawEndingScreens(state === 'ending2');
    for (const p of particles) { const a = Math.min(1, p.life / 30); if (p.type === 'dust') { X.fillStyle = `rgba(${p.cor},${a * 0.6})`; X.beginPath(); X.arc(p.x, p.y, p.size || 2, 0, 7); X.fill(); } else { X.fillStyle = `rgba(${p.cor},${a})`; X.fillRect(p.x - 2, p.y - 2, 5, 5); } }
    if (endChar >= 40 && iI()) transitionTo(() => { resetGame(); state = 'classroom'; });
  }
  
  if (fadeAlpha > 0) { X.fillStyle = `rgba(0,0,0,${fadeAlpha})`; X.fillRect(0, 0, GW, GH); }
  updateFade();
  for (const k in JP) JP[k] = false; for (const k in mobJP) mobJP[k] = false;
  requestAnimationFrame(loop);
}

resize(); loop();
</script>
</body>
