<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG em Gaia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Interface do Jogo -->
    <div id="ui-container">
        <div id="player-stats">
            <h2>Herói de Gaia</h2>
            <p>HP: <span id="hp">100</span>/100</p>
            <p>Localização: <span id="location">Desconhecida</span></p>
        </div>
        <div id="action-log">
            <p>Bem-vindo ao mundo de Gaia!</p>
        </div>
    </div>

    <!-- Container do Mapa (Câmera) -->
    <div id="game-window">
        <div id="map-container">
            <!-- COLE O SEU CÓDIGO <svg> COMPLETO AQUI DENTRO -->
            <!-- Exemplo: <svg id="map" width="1024" height="625"... -->
            
            <!-- Personagem do Jogador -->
            <div id="player"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
